<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- Без масштабування подвійним дотиком: дитина натискає швидко, екран не має «стрибати». -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Казка" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; background: #FAF9F5; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Планшет: без підсвітки й меню при довгому натисканні, без зуму від подвійного дотику. */
      body { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
      [role="button"] { -webkit-user-select: none; user-select: none; }
    </style>
  </head>
  <body>
    <noscript>Щоб відкрити Казку, увімкніть JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
